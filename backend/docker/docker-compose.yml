# OCRFlow model-serving stack.
#
# Infra (postgres, redis) has no profile, so it always starts. The gateway and
# the per-provider services are gated behind profiles so you can run all of them
# or just a subset:
#
#   docker compose --profile gateway --profile paddle up --build   # gateway + paddle
#   docker compose --profile all up --build                        # everything
#
# GPU overlays (usually applied by `make gpu-up` / `make ocr-up` after detection):
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml --profile all up
#   docker compose -f docker-compose.yml -f docker-compose.amd.yml --profile all up
#
# Build context is the backend/ directory (one level up from this file).

x-service-base: &service-base
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  environment: &service-env
    OCRFLOW_MODEL_CACHE: /models
    HF_HOME: /models/hf
    OCRFLOW_UPLOAD_DIR: /data/uploads
    OCRFLOW_DEFAULT_DEVICE: auto
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/internal/health"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 30s

services:
  postgres:
    image: postgres:17-alpine
    container_name: ocrflow-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ocrflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ocrflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ocrflow_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Gateway (thin API; forwards inference to provider services) ---------- #
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gateway
    container_name: ocrflow-gateway
    restart: unless-stopped
    profiles: ["gateway", "all"]
    env_file:
      - .env
    environment:
      OCRFLOW_RUNNER_MODE: remote
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ocrflow}:${POSTGRES_PASSWORD:-ocrflow_dev}@postgres:5432/${POSTGRES_DB:-ocrflow}
      REDIS_URL: redis://redis:6379/0
      OCRFLOW_DOCLING_SERVICE_URL: http://docling:8000
      OCRFLOW_SURYA_SERVICE_URL: http://surya:8000
      OCRFLOW_PADDLE_SERVICE_URL: http://paddle:8000
      OCRFLOW_LIQUID_SERVICE_URL: http://liquid:8000
      OCRFLOW_OLLAMA_BASE_URL: http://ollama:11434
      OCRFLOW_UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ocrflow_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gateway
    container_name: ocrflow-worker
    restart: unless-stopped
    profiles: ["gateway", "all"]
    env_file:
      - .env
    environment:
      OCRFLOW_RUNNER_MODE: remote
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ocrflow}:${POSTGRES_PASSWORD:-ocrflow_dev}@postgres:5432/${POSTGRES_DB:-ocrflow}
      REDIS_URL: redis://redis:6379/0
      OCRFLOW_DOCLING_SERVICE_URL: http://docling:8000
      OCRFLOW_SURYA_SERVICE_URL: http://surya:8000
      OCRFLOW_PADDLE_SERVICE_URL: http://paddle:8000
      OCRFLOW_LIQUID_SERVICE_URL: http://liquid:8000
      OCRFLOW_OLLAMA_BASE_URL: http://ollama:11434
      OCRFLOW_UPLOAD_DIR: /data/uploads
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info"]
    volumes:
      - ocrflow_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started

  # --- Provider services (optional microservices) --------------------------- #
  # Profiles keep them off unless requested. Ports are published so a host
  # uvicorn gateway (OCRFLOW_RUNNER_MODE=remote) can reach them during local
  # hybrid development. On the compose network the gateway still uses the
  # service DNS names set above.
  paddle:
    <<: *service-base
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: paddle
    container_name: ocrflow-paddle
    profiles: ["paddle", "all"]
    ports:
      - "8103:8000"
    environment:
      <<: *service-env
      OCRFLOW_SERVICE_PROVIDER: paddle
    volumes:
      - ocrflow_paddle_models:/models
      - ocrflow_uploads:/data/uploads:ro

  docling:
    <<: *service-base
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: docling
    container_name: ocrflow-docling
    profiles: ["docling", "all"]
    ports:
      - "8102:8000"
    environment:
      <<: *service-env
      OCRFLOW_SERVICE_PROVIDER: docling
    volumes:
      - ocrflow_docling_models:/models
      - ocrflow_uploads:/data/uploads:ro

  surya:
    <<: *service-base
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: surya
    container_name: ocrflow-surya
    profiles: ["surya", "all"]
    ports:
      - "8101:8000"
    environment:
      <<: *service-env
      OCRFLOW_SERVICE_PROVIDER: surya
    volumes:
      - ocrflow_surya_models:/models
      - ocrflow_uploads:/data/uploads:ro

  liquid:
    <<: *service-base
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: liquid
    container_name: ocrflow-liquid
    profiles: ["liquid", "all"]
    ports:
      - "8104:8000"
    environment:
      <<: *service-env
      OCRFLOW_SERVICE_PROVIDER: liquid
    volumes:
      - ocrflow_liquid_models:/models
      - ocrflow_uploads:/data/uploads:ro

  ollama:
    image: ollama/ollama:latest
    container_name: ocrflow-ollama
    restart: unless-stopped
    profiles: ["ollama", "all"]
    ports:
      - "11434:11434"
    volumes:
      - ocrflow_ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ocrflow_pg_data:
  ocrflow_redis_data:
  ocrflow_uploads:
  ocrflow_paddle_models:
  ocrflow_docling_models:
  ocrflow_surya_models:
  ocrflow_ollama_models:
  ocrflow_liquid_models:
