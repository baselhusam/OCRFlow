# Backward-compatible alias of docker-compose.nvidia.yml.
# Prefer `make gpu-up` (auto-detects NVIDIA / AMD / Apple GPU) or the
# vendor-named overlay. Kept so existing docs and scripts keep working.

x-gpu-reservation: &gpu-reservation
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: ["gpu"]

services:
  paddle:
    <<: *gpu-reservation
    build:
      args:
        ACCELERATOR: cuda
    environment:
      OCRFLOW_DEFAULT_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  docling:
    <<: *gpu-reservation
    build:
      args:
        ACCELERATOR: cuda
    environment:
      OCRFLOW_DEFAULT_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

  surya:
    <<: *gpu-reservation
    build:
      args:
        ACCELERATOR: cuda
    environment:
      OCRFLOW_DEFAULT_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
